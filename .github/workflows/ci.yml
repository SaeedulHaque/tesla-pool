name: CI

# Runs on every pull request into main and on pushes to main, pre-release and release branches.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, pre-release, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tesla
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: tesla_pool_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U tesla -d tesla_pool_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tesla:change-me@localhost:5433/tesla_pool_test
      CONCURRENCY_RUNS: '50'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (real Postgres, includes the 50x last-seat race)
        run: npm run test:integration
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Compose builds and the stack becomes healthy
        run: |
          docker compose up -d --build --wait --wait-timeout 300
          curl -fsS http://localhost:4000/health/ready
          curl -fsS -o /dev/null http://localhost:3000/login
      - if: failure()
        run: docker compose logs
